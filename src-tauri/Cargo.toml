[package]
name = "lam-code"
version = "1.0.0"
description = "LAM-Code — IDE agentique (Windows)"
authors = ["LAM-Code"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lam_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
once_cell = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
