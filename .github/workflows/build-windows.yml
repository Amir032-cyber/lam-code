name: Windows (Tauri .exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build Tauri (NSIS) et release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        with:
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: LAM-Code ${{ github.ref_name }}
          releaseBody: "Installeur Windows (NSIS) et APK Android. L'exécutable n'est pas signé : Windows SmartScreen affichera un avertissement (Informations complémentaires → Exécuter quand même)."
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: lam-code-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
